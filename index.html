<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10120f"><meta name="description" content="Gully — a student-first community network. Your campus, your people, your feed."><title>Gully — Your campus, your people</title>
<style>
:root{--bg:#10120f;--panel:#191d18;--panel2:#20251e;--line:#30372c;--text:#f2f5eb;--muted:#a3ad98;--lime:#c8f169;--pink:#ff789d;--blue:#9bc8ff;--good:#86d6a2;--shadow:0 18px 50px #0005;color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 12% -10%,#35432955,transparent 65%),var(--bg);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:var(--lime)}.shell{max-width:1180px;margin:auto;padding:0 22px}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#10120feF;backdrop-filter:blur(16px);z-index:20}.brand{display:flex;align-items:center;gap:11px;font-weight:950;font-size:24px;letter-spacing:-1.5px;color:var(--lime)}.brandmark{width:36px;height:36px;border-radius:12px;background:var(--lime);color:#151910;display:grid;place-items:center;font-weight:1000;font-size:22px}.top-actions,.row{display:flex;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:220px minmax(0,660px) 260px;gap:24px;padding-top:25px;align-items:start}.side,.right{position:sticky;top:98px}.nav{display:grid;gap:7px}.nav button,.btn,.tab,.pill{border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted);padding:12px 14px;text-align:left;font-weight:700;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}.nav button.active .ico{color:var(--lime)}.ico{width:20px;text-align:center;font-size:18px}.side-card,.card{background:linear-gradient(145deg,#1b2019,#171b16);border:1px solid var(--line);border-radius:20px;padding:17px}.side-card{margin-top:20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:900}.h-title{font-size:27px;letter-spacing:-1px;margin:0}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}.main{min-width:0}.page-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 17px;gap:12px}.tabs{display:flex;gap:5px;background:var(--panel);padding:5px;border-radius:14px;border:1px solid var(--line)}.tab{padding:8px 13px;border-radius:10px;font-size:13px}.tab.active{background:var(--lime);color:#17200f}.btn{justify-content:center;text-align:center;background:var(--lime);color:#18200f;border:0;padding:11px 16px;border-radius:12px;font-weight:850}.btn:hover{filter:brightness(1.06)}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#542532;color:#ffdce5}.btn:disabled{opacity:.5;cursor:not-allowed}.composer{display:flex;gap:12px;margin-bottom:16px}.avatar{width:43px;height:43px;border-radius:15px;background:#c8f169;color:#1a2112;display:grid;place-items:center;font-weight:950;flex:none}.avatar.sm{width:34px;height:34px;border-radius:12px;font-size:13px}.avatar.xs{width:27px;height:27px;border-radius:9px;font-size:11px}.composer-box{flex:1;min-width:0}.composer textarea{width:100%;min-height:74px;resize:vertical;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--text);outline:none}.composer textarea:focus,input:focus,textarea:focus,select:focus{border-color:#9abf50;box-shadow:0 0 0 3px #c8f16920;outline:none}.composer-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:10px}.feed{display:grid;gap:12px}.post{padding:17px}.post-head{display:flex;gap:11px;align-items:flex-start}.post-meta{flex:1;min-width:0}.post-name{font-weight:850}.post-time{font-size:12px;color:var(--muted);margin-left:7px}.post-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;margin:13px 0 9px;font-size:15px}.post-reason{font-size:11px;color:var(--muted);padding:7px 9px;background:#ffffff08;border-radius:8px;display:inline-block}.post-actions{display:flex;gap:7px;border-top:1px solid var(--line);margin-top:13px;padding-top:11px}.action{background:transparent;color:var(--muted);border:0;border-radius:9px;padding:7px 10px;font-size:13px}.action:hover,.action.on{background:var(--panel2);color:var(--lime)}.tag{font-size:11px;color:var(--lime);background:#c8f16918;padding:4px 8px;border-radius:99px}.verified{color:var(--blue);font-size:12px}.comments{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:grid;gap:10px}.comment{display:flex;gap:8px}.comment-text{font-size:13px;line-height:1.45}.comment-input{display:flex;gap:8px}.field{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 13px}.field::placeholder,textarea::placeholder{color:#7f8978}.searchbar{display:flex;gap:8px;margin-bottom:14px}.section{margin:20px 0 10px}.section h3{font-size:14px;margin:0 0 10px}.right .card{margin-bottom:13px}.trend{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.trend:last-child{border:0}.channel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.channel:last-child{border:0}.channel-name{font-weight:850}.modal-back{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.modal h2{margin:0 0 7px}.modal .field{margin:7px 0}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e8f6d4;color:#18200f;padding:12px 18px;border-radius:12px;font-weight:750;z-index:90;box-shadow:var(--shadow);max-width:90vw}.empty{padding:36px 20px;text-align:center}.empty .emoji{font-size:34px}.badge{font-size:10px;padding:4px 7px;border-radius:99px;background:#ffffff12;color:var(--muted)}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slider-row{display:grid;grid-template-columns:1fr 150px;align-items:center;gap:10px;margin:13px 0}.slider-row input{width:100%;accent-color:var(--lime)}.footer{font-size:11px;color:var(--muted);text-align:center;padding:25px}.mobile-nav{display:none}.hide{display:none!important}.notice{padding:12px;border-radius:12px;background:#c8f16914;border:1px solid #c8f16944;color:#dcedc1;font-size:13px;line-height:1.5}.report{border:1px solid var(--line);padding:14px;border-radius:13px;margin:9px 0}.profile-stat{display:flex;gap:18px;margin:14px 0}.profile-stat b{font-size:18px}.profile-stat span{display:block;font-size:11px;color:var(--muted)}
@media(max-width:980px){.layout{grid-template-columns:190px minmax(0,1fr)}.right{display:none}}@media(max-width:680px){.shell{padding:0 13px}.topbar{height:64px}.layout{display:block;padding-top:16px}.side{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#10120ff2;border-top:1px solid var(--line);justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:3px;padding:4px 8px}.mobile-nav button.active{color:var(--lime)}.mobile-nav .ico{font-size:19px}.footer{padding-bottom:90px}.post{padding:14px}.h-title{font-size:23px}.top-actions .hide-mobile{display:none}.page-head{align-items:flex-start;flex-direction:column}.composer textarea{min-height:65px}.settings-grid{grid-template-columns:1fr}.slider-row{grid-template-columns:1fr 110px}}
</style></head><body>
<header class="topbar"><div class="shell row" style="width:100%;justify-content:space-between"><div class="brand"><span class="brandmark">g.</span> GULLY</div><div class="top-actions"><span id="modeLabel" class="badge">DEMO MODE</span><button class="btn secondary" id="accountBtn">Sign in</button><button class="btn ghost hide-mobile" id="settingsBtn">Settings</button></div></div></header>
<div class="shell layout"><aside class="side"><nav class="nav" id="sideNav"></nav><div class="side-card"><div class="eyebrow">The Gully promise</div><p style="font-weight:850;line-height:1.35">Your campus. Your people. Your feed.</p><p class="muted small">No paid reach. No engagement tricks. You choose what matters.</p></div><div class="side-card"><div class="eyebrow">Prototype status</div><p class="small" id="statusText">Running locally in demo mode.</p><button class="btn secondary" style="width:100%;margin-top:8px" id="connectBtn">Connect backend</button></div></aside>
<main class="main" id="main"></main><aside class="right" id="rightRail"></aside></div><nav class="mobile-nav" id="mobileNav"></nav><div class="footer">Gully MVP · Student-first community prototype · <span id="footerMode">Demo data stays in this browser.</span></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>Math.random().toString(36).slice(2,10), now=()=>new Date().toISOString();
const KEY='gully_mvp_v1',CFG='gully_supabase_config';
const seed={profile:{id:'me',display_name:'You',campus:'IIT Delhi',role:'user',bio:'Here for the campus conversations.'},profiles:[{id:'p1',display_name:'Priya Sharma',campus:'IIT Delhi',role:'user'},{id:'p2',display_name:'Rohan Mehta',campus:'IIT Delhi',role:'user'},{id:'p3',display_name:'Aarav Singh',campus:'Plaksha University',role:'user'},{id:'p4',display_name:'Simran Kaur',campus:'Plaksha University',role:'user'},{id:'p5',display_name:'Kabir Jain',campus:'NIT Jalandhar',role:'user'}],posts:[{id:'s1',user_id:'p1',body:'Placement season starts next week. Anyone sharing resume tips?',created_at:new Date(Date.now()-3600000).toISOString(),likes:9,comments:[{id:'c1',user_id:'p4',body:'Keep it one page and lead with projects.',created_at:now()},{id:'c2',user_id:'p2',body:'Happy to share mine, ping me.',created_at:now()}],liked:false,channel_id:null},{id:'s2',user_id:'p3',body:'Day 3 at campus. The mess food is better than I expected.',created_at:new Date(Date.now()-7200000).toISOString(),likes:3,comments:[],liked:false,channel_id:null},{id:'s3',user_id:'p5',body:'Hot take: the metro is the best thing to happen to this city.',created_at:new Date(Date.now()-14400000).toISOString(),likes:14,comments:[{id:'c3',user_id:'p1',body:'Agreed, my commute halved.',created_at:now()}],liked:false,channel_id:null},{id:'s4',user_id:'p2',body:'Looking for a study group for the maths exam.',created_at:new Date(Date.now()-86400000).toISOString(),likes:2,comments:[],liked:false,channel_id:null}],follows:['p1'],channels:[{id:'ch1',name:'Placement Prep',description:'Resume tips, interview experiences and OA help.',created_by:'p1',members:128},{id:'ch2',name:'Campus Food',description:'Mess reviews and the best chai spots.',created_by:'p4',members:76}],joined:['ch1'],reports:[],weights:{following:6,campus:4,popular:3},muted:[],trending:{'placement season':41,metro:28,'maths exam':22,'chai':15,'mess food':12,'resume tips':9}};
let data=load(),cfg=readCfg(),sb=null,user=null,view='Home',feedMode='ranked',channelId=null,searchTerm='',showTune=false,commentPost=null,modView='reports',isBusy=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function readCfg(){try{return JSON.parse(localStorage.getItem(CFG))||{}}catch{return {}}}
function demo(){return !sb}function toast(t){$('#toastRoot').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',3200)}
function person(id){if(id==='me'||id===data.profile.id)return data.profile;return data.profiles.find(p=>p.id===id)||{id,display_name:'Gully member',campus:'Campus member',role:'user'}}function initials(n){return (n||'G').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function ago(d){let m=Math.max(1,Math.floor((Date.now()-new Date(d).getTime())/60000));return m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'}
function nav(){let items=[['Home','⌂'],['Explore','⌕'],['Channels','#'],['Campus circle','◎'],['Moderation','⚑']];let html=items.map(([n,i])=>`<button data-view="${n}" class="${view===n?'active':''}"><span class="ico">${i}</span>${n}</button>`).join('');$('#sideNav').innerHTML=html;$('#mobileNav').innerHTML=items.slice(0,4).map(([n,i])=>`<button data-view="${n}" class="${view===n?'active':''}"><span class="ico">${i}</span>${n}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}
function header(title,sub=''){return `<div class="page-head"><div><div class="eyebrow">GULLY COMMUNITY</div><h1 class="h-title">${title}</h1>${sub?`<div class="muted small">${sub}</div>`:''}</div></div>`}
function avatar(p,size=''){return `<div class="avatar ${size}">${esc(initials(p.display_name))}</div>`}
function getPosts(){if(sb&&!user)return [];return data.posts.filter(p=>!p.removed&&!data.reports.some(r=>r.post_id===p.id&&r.status==='removed')&&!data.muted.some(w=>p.body.toLowerCase().includes(w.toLowerCase()))&&(!p.channel_id||data.joined.includes(p.channel_id)||view==='Channels'))}
function rank(p){let age=(Date.now()-new Date(p.created_at).getTime())/3600000;let follow=data.follows.includes(p.user_id)?data.weights.following:0;let campus=person(p.user_id).campus===data.profile.campus?data.weights.campus:0;return p.likes*data.weights.popular+follow+campus-age*.35}
function reason(p){if(feedMode==='latest')return 'Newest first';if(p.user_id==='me')return 'Your post';if(data.follows.includes(p.user_id))return 'You follow this person';if(person(p.user_id).campus===data.profile.campus)return 'From your campus';return 'Popular in the community'}
function postCard(p){let u=person(p.user_id),liked=!!p.liked,follow=data.follows.includes(p.user_id),comments=p.comments||[];return `<article class="card post" data-post="${esc(p.id)}"><div class="post-head">${avatar(u)}<div class="post-meta"><div><span class="post-name">${esc(u.display_name)}</span> ${u.role==='moderator'?'<span class="verified">◆ Moderator</span>':''}<span class="post-time">${ago(p.created_at)}</span></div><div class="muted tiny">${esc(u.campus||'Campus not set')}</div></div>${p.user_id!=='me'?`<button class="btn ghost" data-follow="${esc(u.id)}">${follow?'Following':'Follow'}</button>`:''}</div>${p.channel_id?`<div style="margin-top:9px"><span class="tag"># ${esc(channel(p.channel_id)?.name||'Channel')}</span></div>`:''}<div class="post-body">${esc(p.body)}</div><span class="post-reason">Why this appears · ${esc(reason(p))}</span><div class="post-actions"><button class="action ${liked?'on':''}" data-like="${esc(p.id)}">♥ ${p.likes||0}</button><button class="action" data-comment="${esc(p.id)}">◌ ${comments.length} replies</button><button class="action" data-report="${esc(p.id)}">⚑ Report</button></div>${commentPost===p.id?`<div class="comments">${comments.map(c=>`<div class="comment">${avatar(person(c.user_id),'xs')}<div class="comment-text"><b>${esc(person(c.user_id).display_name)}</b> <span class="muted">${ago(c.created_at)}</span><div>${esc(c.body)}</div></div></div>`).join('')}<div class="comment-input"><input class="field" id="comment-${esc(p.id)}" placeholder="Add a thoughtful reply…"><button class="btn" data-send-comment="${esc(p.id)}">Reply</button></div></div>`:''}</article>`}
function channel(id){return data.channels.find(c=>c.id===id)}function compose(){return `<div class="card composer"><div class="avatar">${initials(data.profile.display_name)}</div><div class="composer-box"><textarea id="newPost" maxlength="500" placeholder="What's happening on your campus? Share something useful…"></textarea><div class="composer-foot"><select id="postChannel" class="field" style="max-width:190px;padding:8px"><option value="">Everyone</option>${data.channels.filter(c=>data.joined.includes(c.id)).map(c=>`<option value="${esc(c.id)}"># ${esc(c.name)}</option>`).join('')}</select><span class="muted tiny">Be kind. Keep it constructive.</span><button class="btn" id="publishBtn">Post</button></div></div></div>`}
function renderHome(){if(sb&&!user)return `${header('Welcome to Gully','Sign in to see the live community feed.') }<div class="notice">Your Supabase project is connected. Sign in with your email to load real community data. Demo sample posts are hidden in connected mode.</div><button class="btn" id="homeSignIn" style="margin-top:12px">Sign in with email</button>`;let posts=getPosts().filter(p=>feedMode!=='following'||p.user_id==='me'||data.follows.includes(p.user_id));posts.sort((a,b)=>feedMode==='ranked'?rank(b)-rank(a):new Date(b.created_at)-new Date(a.created_at));return `${header('Your campus, your people','A quieter social network built around real communities.')}${compose()}<div class="page-head"><div class="tabs"><button class="tab ${feedMode==='ranked'?'active':''}" data-feed="ranked">For you</button><button class="tab ${feedMode==='latest'?'active':''}" data-feed="latest">Latest</button><button class="tab ${feedMode==='following'?'active':''}" data-feed="following">Following</button></div><button class="btn ghost" id="tuneBtn">⚙ Tune feed</button></div>${showTune?`<div class="card" style="margin-bottom:13px"><b>You're in control of your feed</b><p class="muted small">Adjust what Gully gives more weight to. These settings do not limit what you can see.</p>${[['following','People you follow'],['campus','Your campus'],['popular','Popular posts']].map(([k,n])=>`<div class="slider-row"><label>${n}</label><input type="range" min="0" max="10" value="${data.weights[k]}" data-weight="${k}"></div>`).join('')}<div class="row"><input id="muteWord" class="field" placeholder="Mute a word or phrase"><button class="btn secondary" id="muteBtn">Mute</button></div><div class="row" style="margin-top:9px">${data.muted.map(w=>`<button class="pill" data-unmute="${esc(w)}">${esc(w)} ×</button>`).join('')}</div></div>`:''}<div class="feed">${posts.length?posts.map(postCard).join(''):`<div class="card empty"><div class="emoji">🌱</div><h3>Your feed starts here</h3><p class="muted">Follow students, join a channel or switch to For you to discover conversations.</p></div>`}</div>`}
function renderExplore(){let q=searchTerm.toLowerCase();let posts=getPosts().filter(p=>p.body.toLowerCase().includes(q));let people=data.profiles.filter(p=>(p.display_name+' '+(p.campus||'')).toLowerCase().includes(q));let chans=data.channels.filter(c=>(c.name+' '+c.description).toLowerCase().includes(q));return `${header('Explore','Find people, conversations and communities.') }<div class="searchbar"><input id="searchInput" class="field" placeholder="Search posts, people or channels" value="${esc(searchTerm)}"><button class="btn" id="searchBtn">Search</button></div><div class="section"><h3>People (${people.length})</h3>${people.map(p=>`<div class="channel">${avatar(p,'sm')}<div style="flex:1"><div class="channel-name">${esc(p.display_name)}</div><div class="muted tiny">${esc(p.campus||'Campus not set')}</div></div><button class="btn secondary" data-follow="${esc(p.id)}">${data.follows.includes(p.id)?'Following':'Follow'}</button></div>`).join('')||'<p class="muted small">No matching people.</p>'}</div><div class="section"><h3>Channels (${chans.length})</h3>${chans.map(c=>channelCard(c)).join('')||'<p class="muted small">No matching channels.</p>'}</div><div class="section"><h3>Posts (${posts.length})</h3><div class="feed">${posts.map(postCard).join('')}</div></div>`}
function channelCard(c){let joined=data.joined.includes(c.id);return `<div class="channel"><div style="flex:1"><div class="channel-name"># ${esc(c.name)}</div><div class="muted small">${esc(c.description||'A Gully community')} · ${c.members||1} members</div></div><button class="btn ${joined?'secondary':''}" data-join="${esc(c.id)}">${joined?'Joined':'Join'}</button></div>`}
function renderChannels(){if(channelId){let c=channel(channelId);let ps=getPosts().filter(p=>p.channel_id===channelId).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return `${header('# '+(c?.name||'Channel'),c?.description||'Community channel')}<div class="row" style="margin-bottom:15px"><button class="btn ghost" id="backChannels">← All channels</button>${data.joined.includes(channelId)?'<span class="badge">Member</span>':''}</div>${data.joined.includes(channelId)?compose():`<div class="notice" style="margin-bottom:14px">Join this channel to post and take part in the conversation.</div>`}<div class="feed">${ps.map(postCard).join('')||'<div class="card empty"><div class="emoji">#</div><h3>No posts yet</h3><p class="muted">Start the first conversation in this channel.</p></div>'}</div>`}return `${header('Channels','Interest-based communities, built by students.')}<div class="card"><h3 style="margin-top:0">Start a channel</h3><input class="field" id="channelName" maxlength="36" placeholder="Channel name"><input class="field" id="channelDesc" maxlength="140" placeholder="What is this channel about?" style="margin-top:8px"><button class="btn" id="createChannel" style="margin-top:10px">Create channel</button></div><div class="section"><h3>Discover communities</h3>${data.channels.map(channelCard).join('')}</div>`}
function renderCircle(){return `${header('Campus circle','Find people who share your college experience.')}<div class="card"><h3 style="margin-top:0">Your campus</h3><p class="muted small">${esc(data.profile.campus||'Not set yet')}</p><p class="muted small">Campus verification is not enabled in this demo. In production, verify control of an institutional email address before assigning a verified campus badge.</p><input id="campusInput" class="field" value="${esc(data.profile.campus||'')}" placeholder="Your college or university"><button class="btn" id="saveCampus" style="margin-top:9px">Save campus</button></div><div class="section"><h3>Students to follow</h3>${data.profiles.map(p=>`<div class="channel">${avatar(p,'sm')}<div style="flex:1"><div class="channel-name">${esc(p.display_name)}</div><div class="muted tiny">${esc(p.campus||'Campus not set')}</div></div><button class="btn secondary" data-follow="${esc(p.id)}">${data.follows.includes(p.id)?'Following':'Follow'}</button></div>`).join('')}</div>`}
function renderModeration(){let mine=data.reports.filter(r=>r.reporter_id===(user?.id||'me'));let queue=data.reports.filter(r=>r.status==='open');let canReview=demo()||data.profile.role==='moderator';return `${header('Community safety','Report harmful content. Moderator actions require trusted server-side permissions in production.')}<div class="tabs" style="display:inline-flex"><button class="tab ${modView==='reports'?'active':''}" data-mod="reports">My reports (${mine.length})</button>${canReview?`<button class="tab ${modView==='queue'?'active':''}" data-mod="queue">Review queue (${queue.length})</button>`:''}</div>${demo()?`<button class="btn ghost" id="demoMod" style="margin-top:12px">${data.profile.role==='moderator'?'Exit demo reviewer mode':'Try demo reviewer mode (simulated)'}</button>`:''}${!canReview&&modView==='queue'?'<div class="notice">Only trusted moderators can access the review queue.</div>':modView==='reports'?mine.map(r=>`<div class="report"><b>${esc(r.reason)}</b><div class="muted small">${esc(r.details||'No extra details')} · ${esc(r.status)}</div></div>`).join('')||'<div class="card empty"><h3>No reports yet</h3><p class="muted">Use Report on a post if something feels unsafe.</p></div>':queue.map(r=>{let p=data.posts.find(p=>p.id===r.post_id);return `<div class="report"><div class="eyebrow">${esc(r.reason)}</div><p>${esc(p?.body||'Post unavailable')}</p><div class="muted tiny">Reported by ${esc(person(r.reporter_id).display_name)}</div><div class="row" style="margin-top:10px"><button class="btn danger" data-review="${esc(r.id)}" data-result="removed">Remove post</button><button class="btn secondary" data-review="${esc(r.id)}" data-result="dismissed">Dismiss report</button></div></div>`}).join('')||'<div class="card empty"><h3>Queue is clear</h3><p class="muted">No open reports.</p></div>'}`}
function renderRight(){let trends=Object.entries(data.trending).sort((a,b)=>b[1]-a[1]).slice(0,5);$('#rightRail').innerHTML=`<div class="card"><div class="eyebrow">Trending on Gully</div>${trends.map(([k,v])=>`<div class="trend"><b>${esc(k)}</b><span class="muted">${v} searches</span></div>`).join('')}</div><div class="card"><div class="eyebrow">Good Gully behaviour</div><p class="small">Disagree with ideas, not identities. Protect personal information. Report abuse instead of amplifying it.</p></div><div class="card"><div class="eyebrow">Build status</div><p class="small muted">${demo()?'Demo mode · local sample data':'Connected · Supabase backend'}</p><button class="btn secondary" id="railSettings" style="width:100%">Backend settings</button></div>`;$('#railSettings').onclick=settingsModal}
function render(){nav();$('#modeLabel').textContent=demo()?'DEMO MODE':'LIVE BACKEND';$('#statusText').textContent=demo()?'Local demo data only. Connect Supabase for shared accounts and data.':'Supabase connected. Data is stored remotely.';$('#footerMode').textContent=demo()?'Demo data stays in this browser.':'Connected to Supabase.';$('#accountBtn').textContent=user?'Account':'Sign in';$('#main').innerHTML=({Home:renderHome,Explore:renderExplore,Channels:renderChannels,'Campus circle':renderCircle,Moderation:renderModeration}[view]||renderHome)();renderRight();bind()}
function bind(){document.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>{feedMode=b.dataset.feed;render()});$('#publishBtn')?.addEventListener('click',publish);$('#tuneBtn')?.addEventListener('click',()=>{showTune=!showTune;render()});document.querySelectorAll('[data-weight]').forEach(i=>i.onchange=()=>{data.weights[i.dataset.weight]=+i.value;save();render()});$('#muteBtn')?.addEventListener('click',()=>{let w=$('#muteWord').value.trim();if(w&&!data.muted.includes(w.toLowerCase()))data.muted.push(w.toLowerCase());save();render()});document.querySelectorAll('[data-unmute]').forEach(b=>b.onclick=()=>{data.muted=data.muted.filter(w=>w!==b.dataset.unmute);save();render()});document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>like(b.dataset.like));document.querySelectorAll('[data-comment]').forEach(b=>b.onclick=()=>{commentPost=b.dataset.comment;render()});document.querySelectorAll('[data-send-comment]').forEach(b=>b.onclick=()=>comment(b.dataset.sendComment));document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>follow(b.dataset.follow));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>reportModal(b.dataset.report));document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>join(b.dataset.join));$('#createChannel')?.addEventListener('click',createChannel);$('#backChannels')?.addEventListener('click',()=>{channelId=null;render()});$('#saveCampus')?.addEventListener('click',async()=>{let campus=$('#campusInput').value.trim();if(sb){let {error}=await sb.from('profiles').update({campus}).eq('id',user.id);if(error)return toast(error.message)}data.profile.campus=campus;save();render();toast('Campus updated')});$('#demoMod')?.addEventListener('click',()=>{data.profile.role=data.profile.role==='moderator'?'user':'moderator';save();render();toast('Demo-only reviewer role changed')});$('#searchBtn')?.addEventListener('click',()=>{searchTerm=$('#searchInput').value.trim();if(searchTerm){let k=searchTerm.toLowerCase();data.trending[k]=(data.trending[k]||0)+1;save()}render()});$('#searchInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('#searchBtn').click()});document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{modView=b.dataset.mod;render()});document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(b.dataset.review,b.dataset.result));$('#accountBtn').onclick=()=>user?accountModal():authModal();$('#homeSignIn')?.addEventListener('click',authModal);$('#settingsBtn').onclick=settingsModal;$('#connectBtn').onclick=settingsModal}
async function api(action,fn){if(!sb)return fn();try{return await action()}catch(e){console.error(e);toast(e.message||'Something went wrong');throw e}}
async function publish(){let body=$('#newPost')?.value.trim(),channel_id=$('#postChannel')?.value||null;if(!body)return toast('Write something before posting.');if(body.length>500)return toast('Posts are limited to 500 characters.');if(sb){if(!user)return authModal();let {error}=await sb.from('posts').insert({user_id:user.id,body,channel_id});if(error)return toast(error.message);toast('Post published to Gully.');render();return}data.posts.unshift({id:uid(),user_id:'me',body,created_at:now(),likes:0,comments:[],liked:false,channel_id});save();render();toast('Posted in demo mode')}
async function like(id){let p=data.posts.find(p=>p.id===id);if(!p)return;if(sb){if(!user)return authModal();let {data:existing,error}=await sb.from('likes').select('post_id').eq('post_id',id).eq('user_id',user.id).maybeSingle();if(error)return toast(error.message);let res=existing?await sb.from('likes').delete().eq('post_id',id).eq('user_id',user.id):await sb.from('likes').insert({post_id:id,user_id:user.id});if(res.error)return toast(res.error.message);await loadRemote();render();return}p.liked=!p.liked;p.likes=Math.max(0,(p.likes||0)+(p.liked?1:-1));save();render()}
async function comment(id){let input=$('#comment-'+CSS.escape(id)),body=input?.value.trim();if(!body)return;if(sb){if(!user)return authModal();let {error}=await sb.from('comments').insert({post_id:id,user_id:user.id,body});if(error)return toast(error.message);await loadRemote();commentPost=id;render();return}let p=data.posts.find(p=>p.id===id);p.comments.push({id:uid(),user_id:'me',body,created_at:now()});save();commentPost=id;render()}
async function follow(id){if(sb){if(!user)return authModal();let q=sb.from('follows');let {data:ex}=await q.select('followed_id').eq('follower_id',user.id).eq('followed_id',id).maybeSingle();let r=ex?await q.delete().eq('follower_id',user.id).eq('followed_id',id):await q.insert({follower_id:user.id,followed_id:id});if(r.error)return toast(r.error.message);await loadRemote();render();return}if(data.follows.includes(id))data.follows=data.follows.filter(x=>x!==id);else data.follows.push(id);save();render()}
async function createChannel(){let name=$('#channelName').value.trim(),description=$('#channelDesc').value.trim();if(!name)return toast('Give your channel a name.');if(sb){if(!user)return authModal();let {data:c,error}=await sb.from('channels').insert({name,description,created_by:user.id}).select().single();if(error)return toast(error.message);await sb.from('channel_members').insert({channel_id:c.id,user_id:user.id});await loadRemote();channelId=c.id;render();return}let c={id:uid(),name,description,created_by:'me',members:1};data.channels.unshift(c);data.joined.push(c.id);save();channelId=c.id;render();toast('Channel created in demo mode')}
async function join(id){if(sb){if(!user)return authModal();let joined=data.joined.includes(id);let r=joined?await sb.from('channel_members').delete().eq('channel_id',id).eq('user_id',user.id):await sb.from('channel_members').insert({channel_id:id,user_id:user.id});if(r.error)return toast(r.error.message);await loadRemote();render();return}if(data.joined.includes(id))data.joined=data.joined.filter(x=>x!==id);else data.joined.push(id);save();render()}
function reportModal(id){let p=data.posts.find(p=>p.id===id);if(!p)return;modal(`<h2>Report this post</h2><p class="muted small">Reports go to the community review queue. Please report content, not viewpoints you disagree with.</p><select class="field" id="reportReason"><option>Harassment or bullying</option><option>Hate or identity-based attack</option><option>Threats or violence</option><option>Spam or scam</option><option>Sharing private information</option><option>Other</option></select><textarea id="reportDetails" class="field" placeholder="Optional context" rows="3"></textarea><div class="modal-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="sendReport">Submit report</button></div>`);$('#sendReport').onclick=async()=>{let r={id:uid(),post_id:id,reporter_id:user?.id||'me',reason:$('#reportReason').value,details:$('#reportDetails').value,status:'open',created_at:now()};if(sb){if(!user)return authModal();let {error}=await sb.from('reports').insert({post_id:id,reporter_id:user.id,reason:r.reason,details:r.details});if(error)return toast(error.message);await loadRemote()}else{data.reports.unshift(r);save()}closeModal();toast('Report submitted')};}
async function review(id,result){let r=data.reports.find(r=>r.id===id);if(sb){if(!user)return authModal();let {error}=await sb.rpc('review_report',{p_report_id:id,p_decision:result});if(error)return toast(error.message);await loadRemote();render();return}r.status=result==='removed'?'removed':'dismissed';if(result==='removed'){let p=data.posts.find(p=>p.id===r.post_id);if(p)p.removed=true}save();render();toast('Demo review recorded')}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal-back"><div class="modal">${html}</div></div>`;$('#modalRoot').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);$('#modalRoot').firstElementChild.onclick=e=>{if(e.target.classList.contains('modal-back'))closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function settingsModal(){modal(`<h2>Connect Gully backend</h2><p class="muted small">Use a Supabase project to enable shared accounts, posts and moderation across devices. The anon/public key is intended for browser use; never paste a service-role key here.</p><label class="small">Supabase project URL</label><input id="sbUrl" class="field" placeholder="https://your-project.supabase.co" value="${esc(cfg.url||'')}"><label class="small">Supabase anon/public key</label><textarea id="sbKey" class="field" rows="3" placeholder="eyJ…">${esc(cfg.key||'')}</textarea><div class="notice">First run the included <b>supabase/schema.sql</b> in your Supabase SQL Editor. Configure Auth → URL settings with your GitHub Pages URL. Use a student email domain allow-list if required.</div><div class="modal-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="saveConfig">Connect</button></div>`);$('#saveConfig').onclick=async()=>{let url=$('#sbUrl').value.trim(),key=$('#sbKey').value.trim();if(!/^https:\/\/.+\.supabase\.co$/.test(url)||!key)return toast('Enter a valid Supabase URL and anon key.');cfg={url,key};localStorage.setItem(CFG,JSON.stringify(cfg));closeModal();await initSupabase();render()}}
function authModal(){modal(`<h2>Join Gully</h2><p class="muted small">Sign in with a real email address. Supabase sends a one-time code; no code is generated or displayed by Gully.</p><input id="authEmail" class="field" type="email" placeholder="you@college.edu"><div class="modal-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="sendOtp">Send sign-in code</button></div><div id="otpStep" class="hide"><input id="authOtp" class="field" inputmode="numeric" maxlength="8" placeholder="Email code"><button class="btn" id="verifyOtp" style="width:100%;margin-top:8px">Verify and sign in</button></div><p class="muted tiny">Email ownership verification does not automatically prove student status. Campus verification needs an approved institutional domain policy.</p>`);$('#sendOtp').onclick=async()=>{let email=$('#authEmail').value.trim();if(!email.includes('@'))return toast('Enter a valid email.');if(!sb)return toast('Connect Supabase first to use real sign-in.');let {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)return toast(error.message);$('#otpStep').classList.remove('hide');toast('Check your inbox for the sign-in code.')};$('#verifyOtp').onclick=async()=>{let email=$('#authEmail').value.trim(),token=$('#authOtp').value.trim();let {error}=await sb.auth.verifyOtp({email,token,type:'email'});if(error)return toast(error.message);closeModal();await refreshSession();toast('Signed in')};}
function accountModal(){modal(`<h2>Your account</h2><p class="muted small">${esc(user?.email||'Signed in')}</p><label class="small">Display name</label><input class="field" id="profileName" value="${esc(data.profile.display_name)}"><label class="small">Campus / university</label><input class="field" id="profileCampus" value="${esc(data.profile.campus||'')}"><label class="small">Short bio</label><input class="field" id="profileBio" value="${esc(data.profile.bio||'')}"><div class="modal-actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="saveProfile">Save profile</button><button class="btn danger" id="signOut">Sign out</button></div>`);$('#saveProfile').onclick=async()=>{let patch={display_name:$('#profileName').value.trim(),campus:$('#profileCampus').value.trim(),bio:$('#profileBio').value.trim()};if(!patch.display_name)return toast('Display name is required.');if(sb){let {error}=await sb.from('profiles').update(patch).eq('id',user.id);if(error)return toast(error.message)}Object.assign(data.profile,patch);save();closeModal();render()};$('#signOut').onclick=async()=>{await sb.auth.signOut();user=null;closeModal();render()}}
async function refreshSession(){let {data:s}=await sb.auth.getSession();user=s.session?.user||null;if(user){let {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!p&&!error){let {data:np}=await sb.from('profiles').insert({id:user.id,display_name:user.email.split('@')[0]}).select().single();p=np}if(p)data.profile=p;await loadRemote()}else{data.profile={id:'me',display_name:'You',campus:'',role:'user'};}}
async function loadRemote(){if(!sb||!user)return;let [pr,po,fo,ch,co,li,re,mem]=await Promise.all([sb.from('profiles').select('*'),sb.from('posts').select('*').order('created_at',{ascending:false}).limit(100),sb.from('follows').select('followed_id').eq('follower_id',user.id),sb.from('channels').select('*'),sb.from('comments').select('*').order('created_at'),sb.from('likes').select('post_id,user_id'),sb.from('reports').select('*').order('created_at',{ascending:false}),sb.from('channel_members').select('channel_id').eq('user_id',user.id)]);for(let x of [pr,po,fo,ch,co,li,re,mem])if(x.error)throw x.error;data.profiles=pr.data.filter(p=>p.id!==user.id);data.posts=po.data.map(p=>({...p,removed:p.is_removed,comments:co.data.filter(c=>c.post_id===p.id),liked:li.data.some(l=>l.post_id===p.id),likes:li.data.filter(l=>l.post_id===p.id).length}));data.follows=fo.data.map(x=>x.followed_id);data.channels=ch.data;data.reports=re.data;data.joined=mem.data.map(x=>x.channel_id);}
async function initSupabase(){if(!cfg.url||!cfg.key||!window.supabase)return;try{sb=window.supabase.createClient(cfg.url,cfg.key);await refreshSession();sb.auth.onAuthStateChange(async()=>{await refreshSession();render()});toast('Supabase connected')}catch(e){sb=null;toast('Could not connect: '+e.message)}}
$('#settingsBtn').onclick=settingsModal;$('#connectBtn').onclick=settingsModal;$('#accountBtn').onclick=()=>user?accountModal():authModal();initSupabase().then(()=>render());render();
})();
</script></body></html>
